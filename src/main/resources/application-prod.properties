# Production (SPRING_PROFILES_ACTIVE=prod): no dev defaults. A missing variable stops startup
# instead of silently using a local value or a secret that's checked into the repo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
aurawealth.jwt.secret=${JWT_SECRET}
aurawealth.crypto.token-key=${TOKEN_ENCRYPTION_KEY}
aurawealth.plaid.client-id=${PLAID_CLIENT_ID}
aurawealth.plaid.secret=${PLAID_SECRET}
