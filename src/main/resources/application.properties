spring.application.name=aurawealth

# Local secrets from .env (gitignored, see .env.example); real environment variables take precedence
spring.config.import=optional:file:.env[.properties]

# Database (defaults match docker-compose.yml; override with env vars in deployed environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aurawealth}
spring.datasource.username=${DB_USERNAME:aurawealth}
spring.datasource.password=${DB_PASSWORD:aurawealth}

# Flyway owns the schema; Hibernate only checks entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing (HS256). The default is for local dev only; set JWT_SECRET (32+ random bytes) in deployed environments
aurawealth.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
aurawealth.jwt.ttl=1h

# Plaid (sandbox only in v1); keys come from PLAID_CLIENT_ID / PLAID_SECRET
aurawealth.plaid.client-id=${PLAID_CLIENT_ID:}
aurawealth.plaid.secret=${PLAID_SECRET:}
