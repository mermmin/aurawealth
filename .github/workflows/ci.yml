name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Repository and controller tests run against real Postgres, as they do locally.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aurawealth
          POSTGRES_USER: aurawealth
          POSTGRES_PASSWORD: aurawealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurawealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # JWT and token-key dev defaults from application.properties are fine here: no real data,
    # and Plaid is mocked in every test, so no Plaid keys are needed.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/aurawealth
      DB_USERNAME: aurawealth
      DB_PASSWORD: aurawealth

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
